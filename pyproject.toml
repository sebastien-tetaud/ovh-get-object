[project]
name = "ovh-get-object"
version = "0.1.0"
description = "List and download objects from an OVH Object Storage (S3) bucket."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.43.57",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
